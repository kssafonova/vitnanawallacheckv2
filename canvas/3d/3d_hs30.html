<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D HS/30 | PORTALMSK </title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #e5e5e5;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }
    #info {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 25px;
      border-radius: 0px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      pointer-events: none;
      border: 1px solid #e5e7eb;
    }
    h1 { margin: 0 0 8px 0; font-size: 18px; color: #111; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 13px; color: #64748b; }
    
    .hint {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      pointer-events: none;
    }
    
    .controls-container {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
    }

    .color-picker {
      display: flex;
    }

    .color-btn {
      padding: 10px 20px;
      border: 1px solid #d1d5db;
      border-radius: 0;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #ffffff;
      color: #6b7280;
      transition: all 0.2s;
    }

    .color-btn + .color-btn {
      margin-left: -1px;
    }
    .color-btn:hover {
      border-color: #9ca3af;
      z-index: 1;
    }
    .color-btn.active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
      z-index: 2;
    }

    .action-btn {
      padding: 14px 24px;
      background: #111111;
      color: #ffffff;
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .action-btn:hover {
      background: #333333;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  
  <div class="controls-container">
    <div class="color-picker">
      <button class="color-btn active" id="btn-white">Белый</button>
      <button class="color-btn" id="btn-anthracite">Антрацит</button>
    </div>
    <button class="action-btn" id="btn-toggle">ОТКРЫТЬ ПОРТАЛ</button>
  </div>

  <div class="hint">Зажмите левую кнопку мыши для вращения ↻ | Колесико для масштаба</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e5e5e5');
    scene.fog = new THREE.Fog('#e5e5e5', 5, 15);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    // Камера для проема 3 метра
    camera.position.set(-2.5, 1.2, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.15, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight1.position.set(5, 5, 4);
    dirLight1.castShadow = true;
    dirLight1.shadow.mapSize.width = 2048;
    dirLight1.shadow.mapSize.height = 2048;
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, 4, -4);
    scene.add(dirLight2);

    // Белый профиль RAL 9016 (по умолчанию)
    const alumMaterial = new THREE.MeshStandardMaterial({
      color: 0xeeeeee, // Слегка серый оттенок для реалистичного объема белого цвета
      metalness: 0.1,
      roughness: 0.4,
    });

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.1,
      roughness: 0.05,
      transmission: 0.9, 
      transparent: true,
      opacity: 1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.6,
    });

    // Размеры (Схема А, 3000 x 2300, 2 секции)
    const pWidth = 3.0; 
    const pHeight = 2.3; 
    const frameThick = 0.08;
    const sW = 1.54; // Ширина створки с учетом нахлеста по центру
    const dFrame = 0.16;

    const truePortal = new THREE.Group();

    function createBar(w, h, d, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), alumMaterial);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // ВНЕШНЯЯ РАМА ПОРТАЛА
    truePortal.add(createBar(pWidth, frameThick, dFrame, 0, frameThick/2, 0)); 
    truePortal.add(createBar(pWidth, frameThick, dFrame, 0, pHeight - frameThick/2, 0)); 
    truePortal.add(createBar(frameThick, pHeight, dFrame, -pWidth/2 + frameThick/2, pHeight/2, 0)); 
    truePortal.add(createBar(frameThick, pHeight, dFrame, pWidth/2 - frameThick/2, pHeight/2, 0)); 

    function createSash(handleSide = 'none') {
      const sashGroup = new THREE.Group();
      const sH = pHeight - frameThick * 2;
      const sD = 0.07;

      sashGroup.add(createBar(sW, frameThick, sD, 0, frameThick/2, 0));
      sashGroup.add(createBar(sW, frameThick, sD, 0, sH - frameThick/2, 0));
      sashGroup.add(createBar(frameThick, sH, sD, -sW/2 + frameThick/2, sH/2, 0));
      sashGroup.add(createBar(frameThick, sH, sD, sW/2 - frameThick/2, sH/2, 0));

      const glass = new THREE.Mesh(new THREE.BoxGeometry(sW - frameThick*2, sH - frameThick*2, 0.02), glassMaterial);
      glass.position.set(0, sH/2, 0);
      sashGroup.add(glass);

      if (handleSide !== 'none') {
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.35, 0.04), darkMaterial);
        if (handleSide === 'right') {
          handle.position.set(sW/2 - frameThick - 0.02, sH/2 - 0.1, sD/2 + 0.02);
        } else if (handleSide === 'left') {
          handle.position.set(-sW/2 + frameThick + 0.02, sH/2 - 0.1, sD/2 + 0.02);
        }
        sashGroup.add(handle);
      }
      return sashGroup;
    }

    // Схема А: 1 активная, 1 глухая
    
    // Правая створка (Глухая, задняя колея)
    const fixedRight = createSash('none');
    fixedRight.position.set(0.73, frameThick, -0.04);
    truePortal.add(fixedRight);

    // Левая створка (Активная, передняя колея, ручка справа)
    const activeLeft = createSash('right');
    activeLeft.position.set(-0.73, frameThick, 0.04);
    truePortal.add(activeLeft);

    scene.add(truePortal);

    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({ 
      color: 0xcccccc, 
      roughness: 0.1,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    document.getElementById('btn-white').addEventListener('click', function() {
      alumMaterial.color.setHex(0xeeeeee); // Белый RAL 9016
      document.getElementById('btn-anthracite').classList.remove('active');
      this.classList.add('active');
    });

    document.getElementById('btn-anthracite').addEventListener('click', function() {
      alumMaterial.color.setHex(0x2c3033); // Антрацит RAL 7016
      document.getElementById('btn-white').classList.remove('active');
      this.classList.add('active');
    });

    let targetOpen = 0;
    let currentOpen = 0;

    document.getElementById('btn-toggle').addEventListener('click', function() {
      targetOpen = targetOpen === 0 ? 1 : 0;
      this.textContent = targetOpen === 0 ? 'ОТКРЫТЬ ПОРТАЛ' : 'ЗАКРЫТЬ ПОРТАЛ';
    });

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      currentOpen += (targetOpen - currentOpen) * 0.08;
      
      // Смещение левой створки вправо на 1.45 метра
      activeLeft.position.x = -0.73 + (currentOpen * 1.45);

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function() {
      animate();
    }
  </script>
</body>
</html>
