<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D HS-Портал | Схема D1</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    
    /* Стили для кнопок цветов */
    .color-btn {
      transition: all 0.2s ease;
    }
    .color-btn.active {
      background-color: #111;
      color: white;
      border-color: #111;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      z-index: 10;
    }
    .color-btn.inactive {
      background-color: white;
      color: #6b7280;
      border-color: #d1d5db;
    }
    .color-btn.inactive:hover {
      color: #111;
      border-color: #9ca3af;
    }
  </style>
</head>
<body> 
  
  <!-- Панель управления справа -->
  <div class="absolute top-6 right-6 z-10 flex flex-col items-end gap-5 w-64">
    
    <!-- Переключатель цвета профиля -->
    <div class="w-full">
      <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-2">Цвет профиля</div>
      <div class="flex">
        <button id="btn-anthracite" class="color-btn active flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest border border-r-0 rounded-l-sm">
          Антрацит
        </button>
        <button id="btn-graphite" class="color-btn inactive flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest border rounded-r-sm -ml-[1px]">
          Графит
        </button>
      </div>
    </div>

    <!-- Кнопка открытия/закрытия портала -->
    <button id="btn-toggle" class="w-full py-4 mt-2 bg-[#111] hover:bg-black text-white border-none rounded-sm font-bold text-[11px] uppercase tracking-[0.2em] cursor-pointer transition-colors shadow-lg">
      ОТКРЫТЬ ПОРТАЛ
    </button>
  </div>

  <!-- Подсказка по управлению снизу -->
  <div class="absolute bottom-6 w-full text-center text-gray-400 text-[11px] font-medium tracking-wider pointer-events-none uppercase">
    Зажмите ЛКМ для вращения ↻ &nbsp;|&nbsp; Колесико для масштаба
  </div>

  <!-- Контейнер для 3D сцены -->
  <div id="canvas-container"></div>

  <script>
    // Дожидаемся загрузки скриптов Three.js
    window.onload = function() {
      const container = document.getElementById('canvas-container');
      let width = container.clientWidth;
      let height = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#f4f5f7');
      scene.fog = new THREE.Fog('#f4f5f7', 4, 15);

      const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
      camera.position.set(-2, 1.3, 6.5); // Смотрим чуть сбоку

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.15, 0); // Центр портала
      controls.maxPolarAngle = Math.PI / 2 + 0.05; // Не даем опуститься под пол

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(4, 6, 5);
      dirLight1.castShadow = true;
      dirLight1.shadow.mapSize.width = 2048;
      dirLight1.shadow.mapSize.height = 2048;
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xe0e7ff, 0.4);
      dirLight2.position.set(-5, 3, -4);
      scene.add(dirLight2);

      const alumMaterial = new THREE.MeshStandardMaterial({
        color: 0x383e42, // Антрацит RAL 7016 по умолчанию
        metalness: 0.2,
        roughness: 0.4,
      });

      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.9,
        transparent: true,
        opacity: 1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });

      const handleMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555,
        metalness: 0.8,
        roughness: 0.3,
      });

      const pWidth = 3.0; 
      const pHeight = 2.3;
      const frameThick = 0.08;
      const dFrame = 0.18; // Глубина рамы под 3 направляющие
      
      const sW = pWidth / 3 + 0.04; // Ширина одной створки с учетом нахлеста
      const sH = pHeight - frameThick * 2;

      const truePortal = new THREE.Group();

      function createBar(w, h, d, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), alumMaterial);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      truePortal.add(createBar(pWidth, frameThick, dFrame, 0, frameThick / 2, 0));
      truePortal.add(createBar(pWidth, frameThick, dFrame, 0, pHeight - frameThick / 2, 0));
      truePortal.add(createBar(frameThick, pHeight, dFrame, -pWidth / 2 + frameThick / 2, pHeight / 2, 0));
      truePortal.add(createBar(frameThick, pHeight, dFrame, pWidth / 2 - frameThick / 2, pHeight / 2, 0));

      function createSash(hasHandle = false, isRightSideHandle = false) {
        const sashGroup = new THREE.Group();
        const sD = 0.04;

        sashGroup.add(createBar(sW, frameThick, sD, 0, frameThick / 2, 0));
        sashGroup.add(createBar(sW, frameThick, sD, 0, sH - frameThick / 2, 0));
        sashGroup.add(createBar(frameThick, sH, sD, -sW / 2 + frameThick / 2, sH / 2, 0));
        sashGroup.add(createBar(frameThick, sH, sD, sW / 2 - frameThick / 2, sH / 2, 0));

        const glass = new THREE.Mesh(new THREE.BoxGeometry(sW - frameThick * 2, sH - frameThick * 2, 0.015), glassMaterial);
        glass.position.set(0, sH / 2, 0);
        sashGroup.add(glass);

        if (hasHandle) {
          const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.35, 0.04), handleMaterial);
          if (isRightSideHandle) {
            handle.position.set(sW / 2 - frameThick - 0.02, sH / 2 - 0.1, sD / 2 + 0.02);
          } else {
            handle.position.set(-sW / 2 + frameThick + 0.02, sH / 2 - 0.1, sD / 2 + 0.02);
          }
          handle.castShadow = true;
          sashGroup.add(handle);
        }
        return sashGroup;
      }

      // 1. Правая створка (Глухая) - на внешней направляющей (дальняя, -Z)
      const sashRight = createSash(false);
      sashRight.position.set(pWidth / 3, frameThick, -0.06);
      truePortal.add(sashRight);

      // 2. Центральная створка (Активная) - средняя направляющая (0 Z). Ручка слева.
      const sashCenter = createSash(true, false);
      sashCenter.position.set(0, frameThick, 0);
      truePortal.add(sashCenter);

      // 3. Левая створка (Активная) - внутренняя направляющая (ближняя, +Z). Ручка слева.
      const sashLeft = createSash(true, false);
      sashLeft.position.set(-pWidth / 3, frameThick, 0.06);
      truePortal.add(sashLeft);

      scene.add(truePortal);

      const floorGeo = new THREE.PlaneGeometry(25, 25);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xeaeaea,
        roughness: 0.2,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      floor.receiveShadow = true;
      scene.add(floor);

      let targetOpen = 0;
      let currentOpen = 0;
      
      // Обработчики кнопок цвета
      const btnAnthracite = document.getElementById('btn-anthracite');
      const btnGraphite = document.getElementById('btn-graphite');

      btnAnthracite.addEventListener('click', () => {
        alumMaterial.color.setHex(0x383e42); // Антрацит
        btnAnthracite.classList.replace('inactive', 'active');
        btnGraphite.classList.replace('active', 'inactive');
      });

      btnGraphite.addEventListener('click', () => {
        alumMaterial.color.setHex(0x1a1a1a); // Графит / Темный муар
        btnGraphite.classList.replace('inactive', 'active');
        btnAnthracite.classList.replace('active', 'inactive');
      });

      // Обработчик кнопки открытия
      const btnToggle = document.getElementById('btn-toggle');
      btnToggle.addEventListener('click', () => {
        if (targetOpen === 0) {
          targetOpen = 1;
          btnToggle.textContent = 'ЗАКРЫТЬ ПОРТАЛ';
        } else {
          targetOpen = 0;
          btnToggle.textContent = 'ОТКРЫТЬ ПОРТАЛ';
        }
      });

      function animate() {
        requestAnimationFrame(animate);

        // Плавная интерполяция (LERP)
        currentOpen += (targetOpen - currentOpen) * 0.06;
        
        // Каскадное смещение створок вправо
        // Левая ведущая створка сдвигается на ширину двух секций
        sashLeft.position.x = (-pWidth / 3) + (currentOpen * (pWidth / 3 * 2));
        // Центральная ведомая створка сдвигается на ширину одной секции
        sashCenter.position.x = 0 + (currentOpen * (pWidth / 3));
        // Правая створка (глухая) остается на месте

        controls.update();
        renderer.render(scene, camera);
      }
      
      animate();

      window.addEventListener('resize', () => {
        width = container.clientWidth;
        height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });
    };
  </script>
</body>
</html>
