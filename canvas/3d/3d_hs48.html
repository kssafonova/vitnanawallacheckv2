<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D HS/48 | PORTALMSK </title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #e5e5e5; /* Студийный мягкий фон как на рендерах */
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }
    #info {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 25px;
      border-radius: 0px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      pointer-events: none;
      border: 1px solid #e5e7eb;
    }
    h1 { margin: 0 0 8px 0; font-size: 18px; color: #111; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 13px; color: #64748b; }
    
    .hint {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      pointer-events: none;
    }
    
    .controls-container {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
    }

    .color-picker {
      display: flex;
    }

    .color-btn {
      padding: 10px 20px;
      border: 1px solid #d1d5db;
      border-radius: 0; /* Острые прямые углы как в макете */
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #ffffff;
      color: #6b7280;
      transition: all 0.2s;
    }

    .color-btn + .color-btn {
      margin-left: -1px; /* Наложение рамок друг на друга */
    }
    .color-btn:hover {
      border-color: #9ca3af;
      z-index: 1;
    }
    .color-btn.active {
      background: #111111; /* Строгий черный фон для активной вкладки */
      color: #ffffff;
      border-color: #111111;
      z-index: 2;
    }

    .action-btn {
      padding: 14px 24px;
      background: #111111;
      color: #ffffff;
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .action-btn:hover {
      background: #333333;
    }
  </style>
  <!-- Подключаем Three.js и OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  
  <div class="controls-container">
    <div class="color-picker">
      <button class="color-btn active" id="btn-anthracite">Антрацит</button>
      <button class="color-btn" id="btn-black">Черный</button>
    </div>
    <button class="action-btn" id="btn-toggle">ОТКРЫТЬ ПОРТАЛ</button>
  </div>

  <div class="hint">Зажмите левую кнопку мыши для вращения ↻ | Колесико для масштаба</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e5e5e5'); // Студийный серый фон
    scene.fog = new THREE.Fog('#e5e5e5', 6, 20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    // Камера выставлена так, чтобы показать масштаб 4.8 метровой конструкции
    camera.position.set(-3, 1.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Оптимизация цветопередачи
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.15, 0);

    // Студийное освещение для красивых бликов на стекле и металле
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight1.position.set(5, 5, 4);
    dirLight1.castShadow = true;
    dirLight1.shadow.mapSize.width = 2048;
    dirLight1.shadow.mapSize.height = 2048;
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, 4, -4);
    scene.add(dirLight2);

    // Материал алюминиевого профиля (Антрацит по умолчанию)
    const alumMaterial = new THREE.MeshStandardMaterial({
      color: 0x2c3033,
      metalness: 0.3,
      roughness: 0.5,
    });

    // Полупрозрачное стекло с отражениями
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.1,
      roughness: 0.05,
      transmission: 0.9, 
      transparent: true,
      opacity: 1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    // Фурнитура (ручки, уплотнители)
    const darkMaterial = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.6,
    });

    // Размеры (Открывание от центра, 4 секции)
    const pWidth = 4.88; // ~4800 мм общая ширина
    const pHeight = 2.3; // 2300 мм высота
    const frameThick = 0.08; // Толщина профиля 80мм
    const sW = 1.24; // Ширина одной створки (с учетом нахлеста)
    const dFrame = 0.16; // Глубина общей рамы

    const truePortal = new THREE.Group();

    // Вспомогательная функция создания брусков (профилей)
    function createBar(w, h, d, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), alumMaterial);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // 1. ВНЕШНЯЯ РАМА ПОРТАЛА (Низ, Верх, Лево, Право)
    truePortal.add(createBar(pWidth, frameThick, dFrame, 0, frameThick/2, 0)); 
    truePortal.add(createBar(pWidth, frameThick, dFrame, 0, pHeight - frameThick/2, 0)); 
    truePortal.add(createBar(frameThick, pHeight, dFrame, -pWidth/2 + frameThick/2, pHeight/2, 0)); 
    truePortal.add(createBar(frameThick, pHeight, dFrame, pWidth/2 - frameThick/2, pHeight/2, 0)); 

    // Функция создания отдельной створки (с выбором стороны для ручки)
    function createSash(handleSide = 'none') {
      const sashGroup = new THREE.Group();
      const sH = pHeight - frameThick * 2;
      const sD = 0.07; // Глубина створки

      // Профили створки
      sashGroup.add(createBar(sW, frameThick, sD, 0, frameThick/2, 0)); // Низ
      sashGroup.add(createBar(sW, frameThick, sD, 0, sH - frameThick/2, 0)); // Верх
      sashGroup.add(createBar(frameThick, sH, sD, -sW/2 + frameThick/2, sH/2, 0)); // Лево
      sashGroup.add(createBar(frameThick, sH, sD, sW/2 - frameThick/2, sH/2, 0)); // Право

      // Стекло
      const glass = new THREE.Mesh(new THREE.BoxGeometry(sW - frameThick*2, sH - frameThick*2, 0.02), glassMaterial);
      glass.position.set(0, sH/2, 0);
      sashGroup.add(glass);

      // Ручка Patio Lift
      if (handleSide !== 'none') {
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.35, 0.04), darkMaterial);
        if (handleSide === 'right') {
          handle.position.set(sW/2 - frameThick - 0.02, sH/2 - 0.1, sD/2 + 0.02);
        } else if (handleSide === 'left') {
          handle.position.set(-sW/2 + frameThick + 0.02, sH/2 - 0.1, sD/2 + 0.02);
        }
        sashGroup.add(handle);
      }
      return sashGroup;
    }

    // 2. РАССТАНОВКА 4-х СТВОРОК
    
    // Крайняя Левая (Глухая, задняя колея)
    const fixedLeft = createSash('none');
    fixedLeft.position.set(-1.82, frameThick, -0.04);
    truePortal.add(fixedLeft);

    // Крайняя Правая (Глухая, задняя колея)
    const fixedRight = createSash('none');
    fixedRight.position.set(1.82, frameThick, -0.04);
    truePortal.add(fixedRight);

    // Центральная Левая (Активная, передняя колея, ручка справа)
    const activeLeft = createSash('right');
    activeLeft.position.set(-0.62, frameThick, 0.04);
    truePortal.add(activeLeft);

    // Центральная Правая (Активная, передняя колея, ручка слева)
    const activeRight = createSash('left');
    activeRight.position.set(0.62, frameThick, 0.04);
    truePortal.add(activeRight);

    scene.add(truePortal);

    // Глянцевый студийный пол
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({ 
      color: 0xcccccc, 
      roughness: 0.1, // Легкое отражение
      metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    // Логика переключения ЦВЕТА
    document.getElementById('btn-anthracite').addEventListener('click', function() {
      alumMaterial.color.setHex(0x2c3033); // Антрацит RAL 7016
      document.getElementById('btn-black').classList.remove('active');
      this.classList.add('active');
    });

    document.getElementById('btn-black').addEventListener('click', function() {
      alumMaterial.color.setHex(0x111111); // Глубокий Черный Муар
      document.getElementById('btn-anthracite').classList.remove('active');
      this.classList.add('active');
    });

    // Логика АНИМАЦИИ ОТКРЫВАНИЯ
    let targetOpen = 0; // 0 = закрыто, 1 = открыто
    let currentOpen = 0;

    document.getElementById('btn-toggle').addEventListener('click', function() {
      targetOpen = targetOpen === 0 ? 1 : 0;
      this.textContent = targetOpen === 0 ? 'ОТКРЫТЬ ПОРТАЛ' : 'ЗАКРЫТЬ ПОРТАЛ';
    });

    // Обработка изменения размера окна
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Анимационный цикл
    function animate() {
      requestAnimationFrame(animate);
      
      // Плавное интерполирование (LERP) для анимации разъезжающихся створок
      currentOpen += (targetOpen - currentOpen) * 0.08;
      
      // Максимальный сдвиг створок = 1.15 метра в каждую сторону
      activeLeft.position.x = -0.62 - (currentOpen * 1.15);
      activeRight.position.x = 0.62 + (currentOpen * 1.15);

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function() {
      animate();
    }
  </script>
</body>
</html>
